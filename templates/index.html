<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Student Marks Predictor</h1>
    <p class="subtitle">Enter the details below to estimate the final marks.</p>

    <form id="predict-form" novalidate>
      {% for field in fields %}
      <label>
        <span>{{ field.name.replace('_', ' ')|title }} <output data-for="{{ field.name }}">{{ field.default }}</output></span>
        <input type="range" id="{{ field.name }}" name="{{ field.name }}" min="{{ field.min }}" max="{{ field.max }}" step="{{ field.step }}" value="{{ field.default }}">
      </label>
      {% endfor %}

      <button type="submit" id="submit-btn">Predict marks</button>
    </form>

    <section id="result" class="result hidden" aria-live="polite">
      <div class="score"><span id="marks">0</span><small>/ 100</small></div>
      <div class="grade">Grade: <strong id="grade">-</strong></div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    </section>

    <p id="error" class="error hidden" role="alert"></p>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
